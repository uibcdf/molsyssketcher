<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MolSysSketcher molecular depiction controls</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 24px;
        background: #f2f5f8;
        color: #17212b;
        font: 15px sans-serif;
      }
      h1 {
        font-size: 24px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(400px, 1fr));
        gap: 18px;
      }
      article {
        padding: 16px;
        background: white;
        border-radius: 8px;
        border: 1px solid #d9e1e8;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 17px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .drawing {
        height: 220px;
        min-width: 0;
      }
      img {
        display: block;
        width: 100%;
        height: 220px;
        object-fit: contain;
        background: white;
      }
      figcaption {
        font-size: 12px;
        color: #566573;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      .controls {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      button {
        padding: 5px 10px;
      }
      output {
        display: block;
        min-height: 1.5em;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Molecular depiction controls</h1>
    <p>
      MolSysSketcher SVG primitives beside their RDKit reference. Select atoms
      or bonds in the left drawing. Drag to pan, use the wheel to zoom, or focus
      a drawing and use W/A/S/D, +/− and Home.
    </p>
    <main></main>
    <p>
      <a href="/examples/editor-experiment.html"
        >Internal editing feasibility experiment</a
      >
    </p>
    <script type="module">
      import { createMolecularSvgView } from "/dist/index.js";
      const corpus = (
        await (await fetch("/tests/data/rdkit-prepared.json")).json()
      ).cases;
      const views = [];
      const theme =
        new URLSearchParams(location.search).get("theme") === "dark"
          ? "dark"
          : "light";
      for (const item of corpus) {
        const article = document.createElement("article"),
          heading = document.createElement("h2");
        heading.textContent = item.id;
        const pair = document.createElement("div");
        pair.className = "pair";
        const ownFigure = document.createElement("figure"),
          host = document.createElement("div");
        host.className = "drawing";
        const ownCaption = document.createElement("figcaption");
        ownCaption.textContent = "MolSysSketcher";
        ownFigure.append(host, ownCaption);
        const reference = document.createElement("figure"),
          image = document.createElement("img"),
          referenceCaption = document.createElement("figcaption");
        image.alt = `RDKit reference for ${item.id}`;
        image.src = URL.createObjectURL(
          new Blob([item.reference.svg], { type: "image/svg+xml" }),
        );
        image.addEventListener("load", () => URL.revokeObjectURL(image.src), {
          once: true,
        });
        referenceCaption.textContent = "RDKit reference";
        reference.append(image, referenceCaption);
        pair.append(ownFigure, reference);
        article.append(heading, pair);
        document.querySelector("main").append(article);
        const view = createMolecularSvgView(host, {
          instanceId: `gallery-${item.id}`,
          theme,
        });
        views.push(view);
        const controls = document.createElement("div"),
          status = document.createElement("output");
        controls.className = "controls";
        controls.setAttribute("role", "group");
        controls.setAttribute("aria-label", `Navigation for ${item.id}`);
        for (const [label, action] of [
          ["Zoom in", () => view.zoomBy(1.25)],
          ["Zoom out", () => view.zoomBy(0.8)],
          ["Fit molecule", () => view.fit()],
        ]) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = label;
          button.addEventListener("click", action);
          controls.append(button);
        }
        const show = (pick) =>
          (status.textContent = pick
            ? `${pick.kind}: ${pick.semanticId}`
            : "Hover or select an atom or bond.");
        view.subscribeHover((pick) => show(pick ?? view.state.selection));
        view.subscribeSelection(show);
        show(null);
        article.append(controls, status);
        await view.replace(item.document);
      }
      window.galleryReady = true;
      window.addEventListener(
        "pagehide",
        () => views.forEach((view) => view.dispose()),
        { once: true },
      );
    </script>
  </body>
</html>
